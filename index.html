<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SG Heartstrings Toolkit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: #c2185b; color: white; padding: 16px; text-align: center; }
        main { padding: 20px; }
        .login-container { max-width: 400px; margin: 0 auto; border: 1px solid #ddd; padding: 20px; border-radius: 4px; }
        .login-container h2 { margin-top: 0; }
        label { display: block; margin: 8px 0 4px; }
        input[type="text"], select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { margin-top: 16px; padding: 10px 16px; background: #c2185b; color: #fff; border: none; cursor: pointer; border-radius: 3px; }
        button:hover { background: #ad1457; }
        .error { color: #c2185b; margin-top: 8px; display: none; }
    </style>
</head>
<body>
<header>
    <h1>SG Heartstrings Toolkit</h1>
</header>
<main>
    <div class="login-container">
        <h2>Login</h2>
        <label for="role">Role</label>
        <select id="role">
            <option value="">Select your role</option>
            <option value="facilitator">Facilitator</option>
            <option value="institution">Institution</option>
            <option value="family">Family</option>
        </select>

        <label for="pin">Access code / PIN</label>
        <input type="text" id="pin" autocomplete="off">

        <button id="loginBtn" type="button">Login</button>
        <div id="error" class="error"></div>
    </div>
</main>

<script>
    // Simple front-end role/access-code rules from RCA
    const ACCESS_CODES = {
        facilitator: 'tmsfac26',
        institution: 'tmsins26',
        family: 'tmsfam26'
    };

    const roleEl = document.getElementById('role');
    const pinEl = document.getElementById('pin');
    const errorEl = document.getElementById('error');
    const loginBtn = document.getElementById('loginBtn');

    function showError(message) {
        errorEl.textContent = message;
        errorEl.style.display = 'block';
    }

    function clearError() {
        errorEl.textContent = '';
        errorEl.style.display = 'none';
    }

    function doLogin() {
        clearError();

        const role = roleEl.value;
        const pin = (pinEl.value || '').trim();

        if (!role) {
            showError('Please select a role.');
            return;
        }

        if (!pin) {
            showError('Please enter your access code / PIN.');
            return;
        }

        const expectedPin = ACCESS_CODES[role];

        if (!expectedPin || pin !== expectedPin) {
            showError('Invalid access code / PIN for selected role.');
            return;
        }

        // NOTE: Per RCA, removed undefined debug call: nonExistentValidationCheck();
        // Navigate to next view (placeholder alert for this static index.html)
        alert('Login successful for role: ' + role + '. Proceeding to toolkit...');
        // In the real app this would be a redirect such as:
        // window.location.href = 'home.html?role=' + encodeURIComponent(role);
    }

    loginBtn.addEventListener('click', doLogin);

    pinEl.addEventListener('keyup', function (e) {
        if (e.key === 'Enter') {
            doLogin();
        }
    });
</script>
</body>
</html>
