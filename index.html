<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Toolkit Login - Fixes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 480px;
            margin: 40px auto;
            padding: 20px 24px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            margin-top: 0;
            font-size: 1.6rem;
            color: #222;
        }
        .brand {
            font-weight: bold;
            color: #0070c9;
            margin-bottom: 4px;
        }
        label {
            display: block;
            margin: 12px 0 4px;
            font-size: 0.95rem;
        }
        select, input[type="password"] {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        button {
            margin-top: 16px;
            padding: 10px 16px;
            background-color: #0070c9;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background-color: #005fa3;
        }
        .error {
            margin-top: 10px;
            color: #b00020;
            font-size: 0.9rem;
        }
        .hint {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">Fixes</div>
        <h1>Toolkit Login</h1>
        <p>Please select your role and enter the corresponding access code.</p>

        <label for="role">Role</label>
        <select id="role">
            <option value="">-- Select role --</option>
            <option value="facilitator">Facilitator</option>
            <option value="institution">Institution</option>
            <option value="family">Family</option>
        </select>

        <label for="pin">Access code</label>
        <input type="password" id="pin" autocomplete="off" />

        <button type="button" onclick="doLogin()">Login</button>

        <div id="error" class="error" style="display:none;"></div>
        <div class="hint">If you have trouble logging in, please contact your programme coordinator.</div>
    </div>

    <script>
        // Source-of-truth access codes per RCA for KAN-17
        const ACCESS_CODES = {
            facilitator: 'tmsfac26',
            institution: 'tmsins26',
            family: 'tmsfam26'
        };

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function clearError() {
            const el = document.getElementById('error');
            el.textContent = '';
            el.style.display = 'none';
        }

        function doLogin() {
            clearError();

            const role = document.getElementById('role').value;
            const pin = document.getElementById('pin').value.trim();

            if (!role) {
                showError('Please select a role.');
                return;
            }
            if (!pin) {
                showError('Please enter your access code.');
                return;
            }

            const expected = ACCESS_CODES[role];
            if (!expected) {
                showError('Unknown role selected.');
                return;
            }

            if (pin !== expected) {
                showError('Invalid access code for the selected role.');
                return;
            }

            // NOTE: Per RCA, removed undefined debug call: nonExistentValidationCheck();
            alert('Login successful for role: ' + role + '. Proceeding to toolkit...');
            // In a real deployment, redirect to the appropriate toolkit page here
            // e.g., window.location.href = role + '_toolkit.html';
        }
    </script>
</body>
</html>
