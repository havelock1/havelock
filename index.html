<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SG Heartstrings Toolkit — The Music Scientist</title>
<style>
/* ─── TOKENS ─────────────────────────────────────────── */
:root {
  --red:#90278e;--orange:#e56da9;--yellow:#ffe599;--green:#06D6A0;
  --blue:#0096f4;--purple:#c0276a;--pink:#e56da9;
  --bg:#fdf4fc;--surface:#FFFFFF;--text:#1A1A2E;--text-muted:#6B7280;
  --border:#e8d0e8;--shadow:0 2px 12px rgba(144,39,142,.08);
  --fs-xs:11px;--fs-sm:13px;--fs-base:15px;--fs-lg:17px;--fs-xl:20px;--fs-2xl:24px;--fs-3xl:30px;
  --r:14px;--topbar:56px;--nav:68px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:var(--fs-base);overflow-x:hidden;user-select:none;-webkit-user-select:none;}
button{border:none;background:none;cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:var(--fs-base);}
@media print{body{display:none!important;}}
.watermark{position:fixed;bottom:var(--nav);left:0;right:0;text-align:center;font-size:var(--fs-xs);color:rgba(0,0,0,.12);pointer-events:none;z-index:9999;padding:2px 0;letter-spacing:1px;}
/* ─── TOPBAR ─────────────────────────────────────────── */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar);background:var(--red);display:flex;align-items:center;padding:0 16px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.topbar-logo{font-size:var(--fs-lg);font-weight:900;color:#fff;letter-spacing:-.3px;}
.topbar-logo span{color:var(--yellow);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.em-btn{background:rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:4px 10px;font-size:var(--fs-xs);font-weight:700;border:1px solid rgba(255,255,255,.4);}
.role-badge{background:rgba(255,255,255,.15);color:#fff;border-radius:12px;padding:3px 9px;font-size:var(--fs-xs);font-weight:600;}
.logout-btn{color:rgba(255,255,255,.8);font-size:var(--fs-sm);padding:4px 8px;}
/* ─── BOTTOM NAV ─────────────────────────────────────── */
.bottomnav{position:fixed;bottom:0;left:0;right:0;height:var(--nav);background:#fff;border-top:1px solid var(--border);display:flex;z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:all .15s;padding:6px 2px;}
.nav-item.active{color:var(--red);}
.nav-item:not(.active){color:var(--text-muted);}
.nav-icon{font-size:22px;line-height:1;}
.nav-label{font-size:var(--fs-xs);font-weight:600;line-height:1;}
/* ─── PAGE ───────────────────────────────────────────── */
.page{padding-top:calc(var(--topbar)+12px);padding-bottom:calc(var(--nav)+12px);min-height:100vh;}
.inner{max-width:480px;margin:0 auto;padding:0 14px;}
/* ─── CARDS ──────────────────────────────────────────── */
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;}
.section-title{font-size:var(--fs-xl);font-weight:800;color:var(--text);margin-bottom:14px;}
.section-sub{font-size:var(--fs-sm);color:var(--text-muted);margin-bottom:16px;line-height:1.5;}
/* ─── HOME TILES ─────────────────────────────────────── */
.home-hero{background:linear-gradient(135deg,var(--red),#5d1260);border-radius:var(--r);padding:20px;margin-bottom:14px;color:#fff;text-align:center;}
.home-hero h1{font-size:var(--fs-2xl);font-weight:900;line-height:1.2;}
.home-hero p{font-size:var(--fs-sm);margin-top:6px;opacity:.9;line-height:1.5;}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.home-tile{background:#fff;border-radius:16px;padding:22px 14px 18px;text-align:center;cursor:pointer;border:2px solid transparent;box-shadow:var(--shadow);transition:all .18s;position:relative;overflow:hidden;}
.home-tile:active{transform:scale(.97);}
.home-tile.t-props{border-color:var(--orange);background:linear-gradient(135deg,#fce8f1,#FFF);}
.home-tile.t-oldies{border-color:var(--purple);background:linear-gradient(135deg,#f5d0f5,#FFF);}
.home-tile.t-songs{border-color:var(--red);background:linear-gradient(135deg,#ede0ff,#FFF);}
.home-tile.t-crafts{border-color:var(--blue);background:linear-gradient(135deg,#e3f3ff,#FFF);}
.tile-icon{font-size:46px;display:block;margin-bottom:10px;line-height:1;}
.tile-title{font-size:var(--fs-base);font-weight:800;color:var(--text);line-height:1.2;}
.tile-sub{font-size:var(--fs-xs);color:var(--text-muted);margin-top:5px;line-height:1.4;}
.home-quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.quick-btn{background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:7px 14px;font-size:var(--fs-sm);font-weight:600;color:var(--text);cursor:pointer;transition:all .15s;}
.quick-btn:active{background:var(--bg);}
/* ─── FILTER CHIPS ───────────────────────────────────── */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:var(--fs-sm);font-weight:600;color:var(--text-muted);cursor:pointer;transition:all .15s;}
.chip.active{background:var(--red);border-color:var(--red);color:#fff;}
/* ─── LIST CARDS ─────────────────────────────────────── */
.item-card{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s;}
.item-card:active{transform:scale(.98);}
.item-emoji{font-size:36px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex-shrink:0;}
.item-info{flex:1;min-width:0;}
.item-title{font-size:var(--fs-base);font-weight:700;line-height:1.2;}
.item-sub{font-size:var(--fs-sm);color:var(--text-muted);margin-top:3px;line-height:1.4;}
.item-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.tag{font-size:var(--fs-xs);padding:2px 8px;border-radius:10px;font-weight:600;}
.tag-theme1{background:#fce8f1;color:#c0276a;}
.tag-theme2{background:#e3f3ff;color:#0096f4;}
.tag-theme3{background:#ede0ff;color:#90278e;}
.tag-theme4{background:#E8FFF4;color:#008050;}
.tag-move{background:#fce8f1;color:#90278e;}
.tag-lang{background:#F0F0F0;color:#404040;}
.tag-diff-easy{background:#E8FFF0;color:#008040;}
.tag-diff-medium{background:#FFF8E0;color:#806000;}
.tag-diff-hard{background:#FFE8E8;color:#A00000;}
.arrow{color:var(--text-muted);font-size:18px;flex-shrink:0;}
/* ─── DETAIL ─────────────────────────────────────────── */
.back-btn{display:flex;align-items:center;gap:6px;color:var(--red);font-weight:700;font-size:var(--fs-base);margin-bottom:16px;cursor:pointer;}
.detail-hero{background:linear-gradient(135deg,var(--red),#5d1260);border-radius:var(--r);padding:20px;margin-bottom:14px;color:#fff;text-align:center;}
.detail-hero .big-emoji{font-size:64px;display:block;margin-bottom:10px;}
.detail-hero h2{font-size:var(--fs-2xl);font-weight:900;line-height:1.2;}
.detail-hero p{font-size:var(--fs-sm);margin-top:6px;opacity:.9;line-height:1.5;}
.detail-section{margin-bottom:14px;}
.detail-section h3{font-size:var(--fs-lg);font-weight:800;margin-bottom:10px;color:var(--text);}
.step-list{display:flex;flex-direction:column;gap:10px;}
.step{display:flex;gap:10px;align-items:flex-start;}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-size:var(--fs-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.step-text{font-size:var(--fs-sm);color:var(--text);line-height:1.5;flex:1;}
.mat-list{display:flex;flex-wrap:wrap;gap:6px;}
.mat-tag{background:#F3F4F6;border-radius:8px;padding:5px 10px;font-size:var(--fs-sm);color:var(--text);}
.highlight-box{border-radius:12px;padding:14px;margin-bottom:10px;}
.highlight-box.green{background:#E8FFF4;border-left:4px solid var(--green);}
.highlight-box.orange{background:#FFF8E8;border-left:4px solid var(--orange);}
.highlight-box.purple{background:#F3EEFF;border-left:4px solid var(--purple);}
.highlight-box.blue{background:#E8F4FD;border-left:4px solid var(--blue);}
.highlight-box.red{background:#FFF0F2;border-left:4px solid var(--red);}
.highlight-title{font-size:var(--fs-sm);font-weight:700;margin-bottom:4px;}
.highlight-text{font-size:var(--fs-sm);color:var(--text);line-height:1.5;}
/* ─── MOVEMENT TABS ──────────────────────────────────── */
.move-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.move-tab{padding:10px;border-radius:10px;border:2px solid var(--border);background:#fff;text-align:center;cursor:pointer;transition:all .15s;}
.move-tab.active{border-color:var(--purple);background:#F3EEFF;}
.move-tab-icon{font-size:24px;display:block;margin-bottom:4px;}
.move-tab-label{font-size:var(--fs-xs);font-weight:700;color:var(--text);line-height:1.3;}
/* ─── VIDEO PLAYER ───────────────────────────────────── */
.video-wrap{border-radius:12px;overflow:hidden;background:#000;margin-bottom:14px;position:relative;padding-top:56.25%;}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
.video-placeholder{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#1A1A2E,#2D2D4E);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;}
.vp-icon{font-size:48px;margin-bottom:12px;}
.vp-title{color:#fff;font-size:var(--fs-base);font-weight:700;margin-bottom:6px;}
.vp-sub{color:rgba(255,255,255,.6);font-size:var(--fs-sm);line-height:1.4;}
.vp-badge{margin-top:12px;background:var(--yellow);color:#000;border-radius:20px;padding:5px 14px;font-size:var(--fs-xs);font-weight:700;}
/* ─── OLDIES ─────────────────────────────────────────── */
.oldies-tabs{display:flex;gap:0;margin-bottom:14px;border-radius:10px;overflow:hidden;border:1.5px solid var(--border);}
.oldies-tab{flex:1;padding:10px;text-align:center;font-size:var(--fs-sm);font-weight:700;cursor:pointer;background:#fff;color:var(--text-muted);transition:all .15s;}
.oldies-tab.active{background:var(--purple);color:#fff;}
.oldie-card{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:10px;}
.oldie-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.oldie-emoji{font-size:30px;}
.oldie-title{font-size:var(--fs-base);font-weight:700;line-height:1.2;}
.oldie-artist{font-size:var(--fs-sm);color:var(--text-muted);margin-top:2px;}
.oldie-note{font-size:var(--fs-sm);color:var(--text);line-height:1.4;margin-bottom:10px;background:#F8F4F0;border-radius:8px;padding:8px 10px;}
.oldie-btns{display:flex;gap:8px;}
.stream-btn{flex:1;padding:8px;border-radius:8px;font-size:var(--fs-sm);font-weight:700;text-align:center;cursor:pointer;text-decoration:none;display:block;}
.stream-btn.spotify{background:#1DB954;color:#fff;}
.stream-btn.yt{background:#FF0000;color:#fff;}
/* ─── FORMS ──────────────────────────────────────────── */
.form-group{margin-bottom:14px;}
.form-label{font-size:var(--fs-sm);font-weight:700;margin-bottom:6px;display:block;color:var(--text);}
.form-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:var(--fs-base);color:var(--text);background:#fff;outline:none;}
.form-input:focus{border-color:var(--red);}
.form-select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:var(--fs-base);color:var(--text);background:#fff;outline:none;appearance:none;}
.scale-btns{display:flex;gap:6px;flex-wrap:wrap;}
.scale-btn{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:var(--fs-sm);font-weight:700;cursor:pointer;transition:all .15s;}
.scale-btn.active{background:var(--red);border-color:var(--red);color:#fff;}
.submit-btn{width:100%;padding:14px;background:var(--red);color:#fff;border-radius:12px;font-size:var(--fs-lg);font-weight:800;cursor:pointer;transition:all .15s;border:none;margin-top:6px;}
.submit-btn:active{transform:scale(.98);opacity:.9;}
.submit-btn:disabled{background:#ccc;cursor:default;}
/* ─── SESSION CARDS ──────────────────────────────────── */
.session-card{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:10px;}
.session-venue{font-size:var(--fs-base);font-weight:700;}
.session-date{font-size:var(--fs-sm);color:var(--text-muted);}
.session-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
.stat-pill{background:#F3F4F6;border-radius:8px;padding:4px 10px;font-size:var(--fs-xs);font-weight:600;}
/* ─── LOGIN ──────────────────────────────────────────── */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#FFF0F0 0%,var(--bg) 100%);}
.login-logo{font-size:var(--fs-3xl);font-weight:900;color:var(--red);margin-bottom:4px;text-align:center;}
.login-logo span{color:var(--orange);}
.login-sub{font-size:var(--fs-sm);color:var(--text-muted);margin-bottom:30px;text-align:center;line-height:1.5;}
.login-card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 4px 24px rgba(0,0,0,.1);width:100%;max-width:360px;}
.role-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px;}
.role-btn{border:2px solid var(--border);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;transition:all .15s;background:#fff;}
.role-btn.selected{border-color:var(--red);background:#FFF0F2;}
.role-btn .r-icon{font-size:28px;display:block;margin-bottom:6px;}
.role-btn .r-label{font-size:var(--fs-xs);font-weight:700;color:var(--text);}
.pin-row{display:flex;gap:8px;margin-bottom:16px;}
.pin-input{flex:1;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-size:var(--fs-lg);text-align:center;letter-spacing:4px;outline:none;}
.pin-input:focus{border-color:var(--red);}
.login-btn{width:100%;padding:14px;background:var(--red);color:#fff;border-radius:12px;font-size:var(--fs-lg);font-weight:800;cursor:pointer;border:none;}
.login-err{color:var(--red);font-size:var(--fs-sm);text-align:center;margin-top:8px;}
/* ─── EMPTY / RESULT ─────────────────────────────────── */
.empty{text-align:center;padding:40px 20px;color:var(--text-muted);}
.empty-icon{font-size:48px;display:block;margin-bottom:12px;}
.result-wrap{text-align:center;padding:30px 0;}
.result-icon{font-size:64px;display:block;margin-bottom:16px;}
.result-title{font-size:var(--fs-2xl);font-weight:900;margin-bottom:8px;}
.result-text{font-size:var(--fs-sm);color:var(--text-muted);line-height:1.5;margin-bottom:24px;}
.res-card{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:10px;}
.res-title{font-size:var(--fs-base);font-weight:700;margin-bottom:6px;}
.res-text{font-size:var(--fs-sm);color:var(--text-muted);line-height:1.5;}
</style>
</head>

    zh:{steps:['一起翻阅食物图片——祖父母指出他们喜爱的食物。','剪出最爱的食物（孩子剪，祖父母选）。','在A3纸上排列成"我家的食物全家福"。','粘贴后加上标签：奶奶爱……我爱……','一起裱框。'],connectionMoment:'对比：祖父母小时候吃的食物与孙辈今天吃的。有什么相同？有什么是新的？',elderlyAdaptation:'祖父母可以撕（不用剪）图片——撕下来同样有艺术效果，也更简单。'},
    ms:{steps:['Telusuri gambar makanan bersama — datuk/nenek tunjuk makanan yang mereka suka.','Gunting makanan kegemaran (kanak-kanak gunting; datuk/nenek pilih).','Susun di atas kertas A3 menjadi "Potret Makanan Keluarga Saya."','Tampal dan tambah label: Nenek suka..., Saya suka...','Bingkaikan bersama.'],connectionMoment:'Bandingkan: makanan yang datuk/nenek makan semasa kecil vs apa yang cucu makan hari ini. Apa yang sama? Apa yang baru?',elderlyAdaptation:'Datuk/nenek boleh koyakkan (bukan gunting) gambar — mengoyak lebih mudah dan masih sah secara artistik.'},
    ta:{steps:['சேர்ந்து உணவு படங்களை பார்வையிடுங்கள் — தாத்தா/பாட்டி விரும்பும் உணவுகளை சுட்டி காட்டட்டும்.','பிடித்த உணவுகளை வெட்டுங்கள் (குழந்தைகள் வெட்டட்டும்; தாத்தா/பாட்டி தேர்வு செய்யட்டும்).','A3 காகிதத்தில் "என் குடும்பத்தின் உணவு சித்திரம்" என வடிவமைக்கவும்.','ஒட்டி லேபில்கள் சேர்க்கவும்: பாட்டி விரும்புவது..., நான் விரும்புவது...','சேர்ந்து சட்டகம் போடுங்கள்.'],connectionMoment:'ஒப்பிடுங்கள்: தாத்தா/பாட்டி சிறுவயதில் சாப்பிட்டது vs பேரன்/பேத்தி இன்று சாப்பிடுவது. என்ன ஒரே மாதிரி? என்ன புதியது?',elderlyAdaptation:'தாத்தா/பாட்டி படங்களை கிழிக்கலாம் (வெட்டாமல்) — கிழிப்பது எளிது மற்றும் கலைத்துவமாகவும் சரியே.'}
  },
  104:{
    zh:{steps:['用手指或画笔将颜料涂在班兰叶上。','用力将叶子压在纸上，保持5秒。','小心揭开，查看图案。','用不同颜色重复，叠加层次。','讨论：你闻到了什么？上次用班兰叶是什么时候？'],connectionMoment:'班兰蛋糕、糕点、椰浆饭里都有班兰……祖父母分享他们最爱哪道用班兰的菜肴。',elderlyAdaptation:'老人握住叶子，孩子负责按压——合作创作，共同完成。'},
    ms:{steps:['Sapukan cat ke daun pandan menggunakan jari atau berus.','Tekan daun kuat ke atas kertas, tahan 5 saat.','Kupas dengan berhati-hati untuk mendedahkan corak.','Ulang dengan warna berbeza. Lapisi untuk kedalaman.','Bincangkan: apa yang anda hidu? Bila kali terakhir guna pandan?'],connectionMoment:'Pandan ada dalam kek pandan, kuih, nasi lemak... datuk/nenek kongsikan hidangan yang mereka kaitkan dengan wangi ini.',elderlyAdaptation:'Warga emas boleh pegang daun sementara kanak-kanak menekan — usaha bersama, ciptaan dikongsi.'},
    ta:{steps:['விரல் அல்லது தூரிகையால் பாண்டன் இலையில் பெயிண்ட் தடவுங்கள்.','இலையை காகிதத்தில் இறுக்கமாக அழுத்துங்கள், 5 நொடி வைத்திருங்கள்.','கவனமாக உரித்து வடிவத்தை வெளிப்படுத்துங்கள்.','வெவ்வேறு வண்ணங்களால் மீண்டும் செய்யுங்கள். ஆழத்திற்கு அடுக்குகள் சேர்க்கவும்.','விவாதியுங்கள்: என்ன வாசனை வருகிறது? கடைசியாக பாண்டன் பயன்படுத்தியது எப்போது?'],connectionMoment:'பாண்டன் கேக், குவே, நாசி லெமாக்கில் பாண்டன் இருக்கும்... தாத்தா/பாட்டி இந்த வாசனையை எந்த உணவுடன் இணைக்கிறார்கள் என்று பகிரட்டும்.',elderlyAdaptation:'மூத்தோர் இலையை பிடிக்கட்டும், குழந்தை அழுத்தட்டும் — கூட்டு முயற்சி, பகிர்ந்த படைப்பு.'}
  },
  105:{
    zh:{steps:['将茶包在水中浸泡。将A4纸揉皱并沾湿，展平晾干（制造古旧感）。','祖父母凭记忆口述一道秘传家常菜谱。','孩子工整地写下菜谱（祖父母指导）。','用水彩铅笔为主要食材配图。','卷成卷轴，用丝带绑好。'],connectionMoment:'祖父母是智慧的守护者。这份菜谱也许从未被书写记录过。',elderlyAdaptation:'祖父母口述，孩子书写。如祖父母想亲自写，提供大握柄毛笔。'},
    ms:{steps:['Rendam beg teh dalam air. Ramas dan basahkan kertas A4, kemudian ratakan untuk kering (memberi rupa usang).','Datuk/nenek diktakan satu resipi keluarga rahsia dari ingatan.','Kanak-kanak tulis resipi dengan tulisan kemas (datuk/nenek bimbing).','Lukiskan bahan utama dengan pensel warna air.','Gulung menjadi skrol dan ikat dengan reben.'],connectionMoment:'Datuk/nenek adalah penjaga ilmu. Resipi ini mungkin tidak pernah ditulis sebelum ini.',elderlyAdaptation:'Datuk/nenek bercakap; kanak-kanak menulis. Jika datuk/nenek ingin menulis, sediakan pen berus pemegang besar.'},
    ta:{steps:['தேநீர் பையை தண்ணீரில் ஊறவிடுங்கள். A4 காகிதத்தை நனைத்து சுருக்கி தட்டையாக காயவிடுங்கள் (பழைய தோற்றம் தருவதற்கு).','தாத்தா/பாட்டி நினைவிலிருந்து ஒரு ரகசிய குடும்ப சமையல் குறிப்பை சொல்லட்டும்.','குழந்தை சமையல் குறிப்பை ஒழுங்காக எழுதட்டும் (தாத்தா/பாட்டி வழிகாட்டட்டும்).','முக்கிய பொருட்களை வாட்டர்கலர் பென்சில்களால் வரையுங்கள்.','சுருட்டி ரிப்பன் கட்டுங்கள்.'],connectionMoment:'தாத்தா/பாட்டி அறிவின் பாதுகாவலர். இந்த சமையல் குறிப்பு இதுவரை எழுதப்பட்டிராமல் இருக்கலாம்.',elderlyAdaptation:'தாத்தா/பாட்டி சொல்லட்டும்; குழந்தை எழுதட்டும். தாத்தா/பாட்டி எழுத விரும்பினால், பெரிய பிடியுள்ள தூரிகை பேனா வழங்கவும்.'}
  },
  201:{
    zh:{steps:['将纸平铺在桌上或地板上。','祖父母描述他们童年的甘榜：水井、大树、邻居的家。','家人边听祖父母讲边画——每人画一个元素。','用祖父母记得的名字给所有地物标注。','加上指北针和标题："外婆的甘榜"/"外公的甘榜"。'],connectionMoment:'问：您在甘榜里最好的朋友是谁？你们在哪里玩？您的甘榜后来怎么了？',elderlyAdaptation:'祖父母可以画一个简单的图形（画个圆表示水井），其余由孩子们填充。'},
    ms:{steps:['Bentangkan kertas rata di atas meja atau lantai.','Datuk/nenek huraikan kampong zaman kecil mereka: perigi, pokok besar, rumah jiran.','Keluarga melukis semasa datuk/nenek bercakap — setiap orang lukis satu elemen.','Labelkan semua ciri dengan nama yang datuk/nenek ingat.','Tambah mawar angin dan tajuk: "Kampong Nenek/Datuk."'],connectionMoment:'Tanya: siapa kawan baik anda di kampong? Di mana anda bermain? Apa yang berlaku kepada kampong anda?',elderlyAdaptation:'Datuk/nenek boleh lukis satu bentuk mudah (bulatan untuk perigi) sementara kanak-kanak melengkapkan yang lain.'},
    ta:{steps:['காகிதத்தை மேசை அல்லது தரையில் தட்டையாக வையுங்கள்.','தாத்தா/பாட்டி தங்கள் சிறுவயது கிராமத்தை விவரிக்கட்டும்: கிணறு, பெரிய மரம், அண்டை வீட்டார் வீடு.','தாத்தா/பாட்டி சொல்வதை கேட்டபடி குடும்பத்தினர் வரைவார்கள் — ஒவ்வொருவரும் ஒரு அம்சம் வரைவார்கள்.','தாத்தா/பாட்டி நினைவிலுள்ள பெயர்களால் அனைத்து இடங்களையும் லேபில் செய்யுங்கள்.','திசைகாட்டி மற்றும் தலைப்பு சேர்க்கவும்: "பாட்டியின்/தாத்தாவின் கிராமம்."'],connectionMoment:'கேளுங்கள்: கிராமத்தில் உங்கள் நெருங்கிய நண்பர் யார்? எங்கே விளையாடினீர்கள்? உங்கள் கிராமம் என்னவாயிற்று?',elderlyAdaptation:'தாத்தா/பாட்டி ஒரு எளிய வடிவம் வரைக்கலாம் (கிணற்றிற்கு ஒரு வட்டம்) மற்றதை குழந்தைகள் நிரப்பட்டும்.'}
  },
  202:{
    zh:{steps:['用铅笔轻轻勾勒一排店屋的轮廓。','用柔和色彩涂墙壁（粉红、黄色、蓝色、绿色）。','添加窗户、百叶窗和五脚基（有盖走廊）。','最后画天空的渲染背景。','祖父母指出哪种颜色最像他们记忆中的店屋。'],connectionMoment:'您的店屋面朝哪条街？底层开的是什么店？楼上住着谁？',elderlyAdaptation:'为老人提供预先描好的轮廓，让他们在里面涂色。专注于色彩，不要求精确。'},
    ms:{steps:['Lakarkan sebaris rumah kedai dengan pensil secara ringan.','Cat dinding dengan warna pastel (merah jambu, kuning, biru, hijau).','Tambah tingkap, kepak dan "five-foot way" (laluan bumbung).','Cat latar langit terakhir.','Datuk/nenek tunjukkan warna mana yang sepadan dengan rumah kedai yang mereka ingati.'],connectionMoment:'Jalan mana yang dihadap rumah kedai anda? Kedai apa yang ada di bawah? Siapa yang tinggal di atas?',elderlyAdaptation:'Sediakan garisan yang telah dilukis untuk warga emas mewarna. Fokus pada warna, bukan ketepatan.'},
    ta:{steps:['பென்சிலால் ஒரு வரிசை ஷாப்ஹவுஸ்களை மெதுவாக வரையுங்கள்.','சுவர்களை மென்மையான நிறங்களில் வரையுங்கள் (இளஞ்சிவப்பு, மஞ்சள், நீலம், பச்சை).','ஜன்னல்கள், ஷட்டர்கள் மற்றும் "ஃபைவ்-ஃபுட் வே" சேர்க்கவும்.','இறுதியில் வானை வரையுங்கள்.','தாத்தா/பாட்டி நினைவிலுள்ள ஷாப்ஹவுஸின் நிறம் எது என்று சுட்டி காட்டட்டும்.'],connectionMoment:'உங்கள் ஷாப்ஹவுஸ் எந்த தெருவை நோக்கி இருந்தது? கீழ் தளத்தில் என்ன கடை இருந்தது? மேல் தளத்தில் யார் இருந்தார்கள்?',elderlyAdaptation:'மூத்தோருக்கு முன்கூட்டியே வரையப்பட்ட வரிவடிவங்களை வழங்குங்கள். துல்லியம் வேண்டாம், வண்ணத்தில் கவனம் செலுத்தட்டும்.'}
  },
  203:{
    zh:{steps:['将盒子内部涂绿色（草岸），底部铺蓝色玻璃纸（水面）。','用黏土塑造小蜻蜓、小鱼和青蛙。','用层叠纸板堆砌堤岸。','摆放孩子们在排水沟边玩耍的小人偶。','祖父母审阅最终场景："对，就是那个样子！"'],connectionMoment:'问祖父母：您曾在水沟里抓过什么？当时被允许吗？有没有被骂过？',elderlyAdaptation:'祖父母捏制黏土小动物（轻柔揉捏有助于手部灵活）。'},
    ms:{steps:['Cat bahagian dalam kotak hijau (tebing berumput) dan lapik tapak dengan selofan biru (air).','Bentukkan capung, ikan, dan katak kecil dari tanah liat.','Bina tebing dengan kad berlapis.','Letakkan patung kanak-kanak bermain di tepi longkang.','Datuk/nenek luluskan pemandangan akhir: "Ya, begitulah rupanya!"'],connectionMoment:'Tanya datuk/nenek: apa yang anda tangkap di longkang? Adakah anda dibenarkan? Adakah anda kena marah?',elderlyAdaptation:'Datuk/nenek uruskan binatang tanah liat (meremas lembut baik untuk ketangkasan tangan).'},
    ta:{steps:['பெட்டியின் உட்பகுதியை பச்சை நிறம் தடவுங்கள் (புல்தரை கரைகள்) மற்றும் அடிப்பகுதியை நீல செலோபேன் விரிக்கவும்.','களிமண்ணால் சிறிய தாளிகள், மீன்கள் மற்றும் தவளைகளை வடிவமைக்கவும்.','அட்டை அடுக்குகளால் கரைகளை கட்டுங்கள்.','வடிகால் ஓரத்தில் விளையாடும் குழந்தைகளின் சிறு சிலைகளை வையுங்கள்.','தாத்தா/பாட்டி இறுதி காட்சியை அங்கீகரிக்கட்டும்: "ஆமா, அப்படித்தான் இருந்தது!"'],connectionMoment:'தாத்தா/பாட்டியிடம் கேளுங்கள்: லோங்காங்கில் என்ன பிடித்தீர்கள்? அனுமதி இருந்ததா? திட்டு வாங்கினீர்களா?',elderlyAdaptation:'தாத்தா/பாட்டி களிமண் விலங்குகளை கையாளட்டும் (மெதுவாக அழுத்துவது கை சுறுசுறுப்பிற்கு நல்லது).'}
  },
  204:{
    zh:{steps:['将水彩纸打湿，画出夕阳渐变色：黄色到橙色再到深红。','完全晾干。','用黑卡纸剪出新加坡天际线：组屋、清真寺穹顶、棕榈树、寺庙。','将剪影粘贴在夕阳背景上。','用白色颜料或白色凝胶笔加上月亮和星星。'],connectionMoment:'祖父母认出了哪些地标？哪些建筑在他们年轻时还不存在？',elderlyAdaptation:'老人可以完成夕阳水彩背景，孩子负责剪切剪影。'},
    ms:{steps:['Basahkan kertas warna air dan cat kecerunan matahari terbenam: kuning ke oren ke merah tua.','Biarkan kering sepenuhnya.','Potong garisan langit Singapura dari kad hitam: blok HDB, kubah masjid, pokok palma, kuil.','Tampal siluet ke atas latar belakang matahari terbenam.','Tambah bulan dan bintang dengan cat putih atau pen gel.'],connectionMoment:'Mercu tanda mana yang datuk/nenek kenali? Bangunan mana yang TIDAK wujud semasa mereka muda?',elderlyAdaptation:'Warga emas boleh lakukan latar belakang warna air matahari terbenam sementara kanak-kanak memotong siluet.'},
    ta:{steps:['வாட்டர்கலர் காகிதத்தை நனைத்து சூரியன் அஸ்தமன சாயல் வரையுங்கள்: மஞ்சளிலிருந்து ஆரஞ்சு, பிறகு ஆழமான சிவப்பிற்கு.','முழுவதுமாக காயவிடுங்கள்.','கருப்பு அட்டையிலிருந்து சிங்கப்பூர் அடிவான விரிவை வெட்டுங்கள்: HDB தொகுதிகள், மசூதி குவிமாடம், பனை மரங்கள், கோயில்.','சூரியன் அஸ்தமன பின்னணியில் சிலுவேட்டை ஒட்டுங்கள்.','வெள்ளை பெயிண்ட் அல்லது ஜெல் பேனாவால் நிலா மற்றும் நட்சத்திரங்கள் சேர்க்கவும்.'],connectionMoment:'தாத்தா/பாட்டி எந்த அடையாளச் சின்னங்களை அடையாளம் காண்கிறார்கள்? அவர்கள் இளமையாக இருந்தபோது இல்லாத கட்டிடங்கள் எவை?',elderlyAdaptation:'மூத்தோர் சூரியன் அஸ்தமன வாட்டர்கலர் பின்னணி செய்யட்டும், குழந்தைகள் சிலுவேட்டை வெட்டட்டும்.'}
  },
  205:{
    zh:{steps:['用扁平黏土板搭建站台。','添加柱子、长椅和屋顶结构。','将工艺棒压入底座作为铁轨。','晾干后上色。','祖父母讲述旧新加坡的交通：三轮车、驳船、电车。'],connectionMoment:'祖父母：地铁出现之前您是怎么出行的？穿越整个岛需要多长时间？',elderlyAdaptation:'祖父母可以为完成的模型上色——即使手部灵活度下降，拿画笔也是做得到的。'},
    ms:{steps:['Bina platform stesen dari kepingan tanah liat rata.','Tambah tiang, bangku dan struktur bumbung.','Tekan kayu kraf ke tapak sebagai landasan kereta api.','Cat apabila kering.','Datuk/nenek cerita tentang pengangkutan lama Singapura: beca, tongkang, trem.'],connectionMoment:'Datuk/nenek: bagaimana anda bergerak sebelum MRT? Berapa lama untuk merentasi pulau?',elderlyAdaptation:'Datuk/nenek boleh mengecat model siap — kerja berus boleh dilakukan walaupun dengan ketangkasan berkurangan.'},
    ta:{steps:['தட்டையான களிமண் தட்டுகளால் நிலைய தளத்தை கட்டுங்கள்.','தூண்கள், இருக்கைகள் மற்றும் கூரை கட்டமைப்பு சேர்க்கவும்.','ரயில் பாதையாக கைவினை குச்சிகளை அடிப்பகுதியில் அழுத்துங்கள்.','காய்ந்தவுடன் வண்ணம் தடவுங்கள்.','தாத்தா/பாட்டி பழைய சிங்கப்பூர் போக்குவரத்தைப் பற்றி சொல்லட்டும்: திரிஷா, பம்போட், டிராம்.'],connectionMoment:'தாத்தா/பாட்டி: MRT வருவதற்கு முன் எப்படி சுற்றினீர்கள்? தீவை கடக்க எவ்வளவு நேரம் ஆனது?',elderlyAdaptation:'தாத்தா/பாட்டி முடிக்கப்பட்ட மாதிரியை வண்ணம் தீட்டலாம் — குறைந்த நேர்த்தியிலும் தூரிகை வேலை செய்யலாம்.'}
  },
  301:{
    zh:{steps:['用鲜艳的传统颜色为蛋盒上色。','晾干，再涂第二层。','收集98粒小种子或石子作为棋子。','祖父母演示如何玩Congkak。','一起来一轮！'],connectionMoment:'祖父母教Congkak规则——这是他们的专长。孩子们是学生。',elderlyAdaptation:'老人负责种子的分配（很好的精细动作练习）。孩子们负责上色。'},
    ms:{steps:['Cat kotak telur dengan warna tradisional yang terang.','Biarkan kering. Tambah lapisan kedua.','Kumpulkan 98 biji atau batu kecil sebagai buah permainan.','Datuk/nenek tunjukkan cara bermain Congkak.','Main satu pusingan bersama!'],connectionMoment:'Datuk/nenek mengajar peraturan Congkak — ini kepakaran mereka. Kanak-kanak adalah pelajar.',elderlyAdaptation:'Warga emas uruskan pengagihan biji (baik untuk motor halus). Kanak-kanak uruskan pengecatan.'},
    ta:{steps:['முட்டை பெட்டியை பிரகாசமான பாரம்பரிய நிறங்களில் வண்ணம் தீட்டுங்கள்.','காயவிடுங்கள். இரண்டாவது அடுக்கு தடவுங்கள்.','விளையாட்டு காய்களாக 98 சிறிய விதைகள் அல்லது கற்களை சேகரிக்கவும்.','தாத்தா/பாட்டி கொங்காக் எப்படி விளையாடுவது என்று காட்டட்டும்.','சேர்ந்து ஒரு சுற்று விளையாடுங்கள்!'],connectionMoment:'தாத்தா/பாட்டி கொங்காக் விதிகளை கற்பிக்கட்டும் — இது அவர்களின் நிபுணத்துவம். குழந்தைகள் மாணவர்கள்.',elderlyAdaptation:'மூத்தோர் விதை விநியோகத்தை கையாளட்டும் (நல்ல நுண் அசைவு பயிற்சி). குழந்தைகள் வண்ணம் தீட்டட்டும்.'}
  },
  302:{
    zh:{steps:['将陀螺分区涂上不同颜色（先不要混合）。','在报纸上旋转陀螺，看颜色如何融合！','晾干，祖父母旋转陀螺展示正确技巧。','尝试不同颜色组合，观察图案变化。'],connectionMoment:'祖父母：您小时候有陀螺吗？曾和朋友比赛过吗？',elderlyAdaptation:'祖父母负责旋转陀螺（手腕控制，熟悉的动作）。孩子负责上色。'},
    ms:{steps:['Cat bahagian gasing dengan warna berbeza (jangan campur dahulu).','Putar gasing di atas surat khabar dan tonton warna bergabung!','Biarkan kering. Datuk/nenek putar gasing untuk menunjukkan teknik yang betul.','Cuba kombinasi warna berbeza dan perhatikan corak yang terhasil.'],connectionMoment:'Datuk/nenek: adakah anda ada gasing semasa kecil? Adakah anda bertanding dengan rakan-rakan?',elderlyAdaptation:'Datuk/nenek putar gasing (kawalan pergelangan tangan, gerakan biasa). Kanak-kanak yang mengecat.'},
    ta:{steps:['கேசிங்கை பிரிவுகளாக வெவ்வேறு நிறங்களில் வண்ணம் தீட்டுங்கள் (இன்னும் கலக்காதீர்கள்).','செய்தித்தாளில் கேசிங்கை சுழற்றி நிறங்கள் இணைவதை பாருங்கள்!','காயவிடுங்கள். தாத்தா/பாட்டி சரியான நுட்பத்தை காட்ட சுழற்றட்டும்.','வெவ்வேறு நிற சேர்க்கைகளை முயற்சிக்கவும் மற்றும் வடிவங்களை கவனிக்கவும்.'],connectionMoment:'தாத்தா/பாட்டி: சிறுவயதில் உங்களுக்கு கேசிங் இருந்ததா? நண்பர்களுடன் போட்டி வைத்தீர்களா?',elderlyAdaptation:'தாத்தா/பாட்டி கேசிங்கை சுழற்றட்டும் (மணிக்கட்டு கட்டுப்பாடு, பழக்கமான அசைவு). குழந்தைகள் வண்ணம் தீட்டட்டும்.'}
  },
  303:{
    zh:{steps:['将两根竹签交叉，在交叉点牢固地绑好。','将纸巾剪成比框架稍大的菱形。','将纸巾粘在框架上，将边缘折叠并粘好。','在交叉点系上细绳。','加上丝带尾巴，用几何图案装饰。'],connectionMoment:'祖父母：您在哪里放过风筝？谁教您的？您有没有进行过风筝大战？',elderlyAdaptation:'祖父母在交叉点系上关键的结——他们的甘榜绳结技艺在这里大放光彩。'},
    ms:{steps:['Silangkan dua pencucuk buluh dan ikat kuat di persimpangan.','Potong kertas tisu menjadi bentuk berlian sedikit lebih besar dari bingkai.','Tampal kertas tisu ke bingkai, lipat dan tampal tepi.','Ikat tali di titik persimpangan.','Tambah ekor reben. Hiaskan dengan corak geometri.'],connectionMoment:'Datuk/nenek: di mana anda menerbangkan layang-layang? Siapa yang ajar anda? Adakah anda ada pertarungan layang-layang?',elderlyAdaptation:'Datuk/nenek ikat simpul penting di persimpangan — kemahiran mengikat tali kampong mereka bersinar di sini.'},
    ta:{steps:['இரண்டு மூங்கில் குச்சிகளை குறுக்கிட்டு வையுங்கள், குறுக்கீட்டில் இறுக்கமாக கட்டுங்கள்.','டிஷ்யூ காகிதத்தை சட்டத்தை விட சற்று பெரிய வைர வடிவில் வெட்டுங்கள்.','டிஷ்யூ காகிதத்தை சட்டத்தில் ஒட்டுங்கள், விளிம்புகளை மடித்து ஒட்டுங்கள்.','குறுக்கீட்டில் நூல் கட்டுங்கள்.','ரிப்பன் வால் சேர்க்கவும். வடிவியல் வடிவங்களால் அலங்கரிக்கவும்.'],connectionMoment:'தாத்தா/பாட்டி: எங்கே பட்டம் பறக்க விட்டீர்கள்? யார் கற்பித்தார்கள்? பட்டம் போர் நடந்ததா?',elderlyAdaptation:'தாத்தா/பாட்டி குறுக்கீட்டில் முக்கியமான முடிச்சை கட்டட்டும் — அவர்களின் கிராம கயிறு கட்டும் திறன் இங்கே பளிச்சிடும்.'}
  },
  304:{
    zh:{steps:['将纸袋倒置——折盖就是嘴巴。','创作运动英雄的脸：头发、眼睛、表情。','用布料碎片为木偶穿上运动服。','祖父母和孩子各自制作自己心目中的运动英雄木偶。','表演一段简短的对话：一位老英雄，一位现代英雄。'],connectionMoment:'祖父母的英雄：P.C. Ramlee？李小龙？甘榜里的足球明星？孩子的英雄：当今运动员？',elderlyAdaptation:'大木偶容易操控，祖父母专注于讲故事，而非制作。'},
    ms:{steps:['Balikkan beg kertas — penutup adalah mulut.','Buat muka wira sukan: rambut, mata, ekspresi.','Pakaikan wayang dengan kostum sukan dari kain buruk.','Datuk/nenek dan kanak-kanak masing-masing buat wayang wira sukan mereka sendiri.','Lakukan dialog wayang singkat: satu wira lama, satu moden.'],connectionMoment:'Wira datuk/nenek: P. C. Ramlee? Bruce Lee? Bintang bola kampong? Wira kanak-kanak: atlet semasa?',elderlyAdaptation:'Wayang besar mudah dikendalikan. Datuk/nenek fokus pada penceritaan bukan pembinaan.'},
    ta:{steps:['காகித பையை தலைகீழாக திருப்புங்கள் — மூடி வாயாகும்.','விளையாட்டு வீரர் முகம் உருவாக்குங்கள்: முடி, கண்கள், வெளிப்பாடு.','துணி கந்தல்களால் பொம்மைக்கு விளையாட்டு உடை அணிவியுங்கள்.','தாத்தா/பாட்டி மற்றும் குழந்தை ஒவ்வொருவரும் தங்கள் விளையாட்டு வீரர் பொம்மை செய்யட்டும்.','ஒரு சிறிய பொம்மை உரையாடல் நடத்துங்கள்: ஒரு பழைய வீரர், ஒரு நவீன வீரர்.'],connectionMoment:'தாத்தா/பாட்டியின் வீரர்: P. C. Ramlee? புருஸ் லீ? கிராம கால்பந்து நட்சத்திரம்? குழந்தையின் வீரர்: தற்போதைய விளையாட்டு வீரர்?',elderlyAdaptation:'பெரிய பொம்மை கையாள எளிது. தாத்தா/பாட்டி கட்டுமானத்தை விட கதை சொல்வதில் கவனம் செலுத்தட்டும்.'}
  },
  305:{
    zh:{steps:['在黑卡纸上勾勒计分板：队名、得分框、奖杯。','将彩色纸撕成小片（1-2厘米）。','用撕碎的纸片填充计分板设计。','用金色纸巾纸填充奖杯部分。','以家庭"队名"为其命名——一起投票决定！'],connectionMoment:'祖父母和孙辈各自选择一个"队伍"，得分庆祝一项家庭成就。',elderlyAdaptation:'撕纸人人都能做到。祖父母撕纸，孩子贴放并粘合。'},
    ms:{steps:['Lakarkan papan skor di kad hitam: nama pasukan, petak skor, trofi.','Koyakkan kertas berwarna menjadi kepingan kecil (1-2 cm).','Isi reka bentuk papan skor dengan mozek kertas koyak.','Tambah kertas tisu emas untuk trofi.','Namakan dengan "nama pasukan" keluarga — undi bersama!'],connectionMoment:'Datuk/nenek dan cucu masing-masing pilih "pasukan." Skor meraikan pencapaian keluarga.',elderlyAdaptation:'Mengoyak kertas boleh dilakukan oleh semua. Datuk/nenek koyak sementara kanak-kanak letak dan tampal.'},
    ta:{steps:['கருப்பு அட்டையில் ஸ்கோர்போர்டை வரையுங்கள்: அணி பெயர்கள், ஸ்கோர் பெட்டிகள், கோப்பை.','வண்ணக் காகிதத்தை சிறிய துண்டுகளாக கிழியுங்கள் (1-2 செமீ).','கிழிக்கப்பட்ட காகித துண்டுகளால் ஸ்கோர்போர்டை நிரப்புங்கள்.','கோப்பைக்கு தங்க நிற டிஷ்யூ காகிதம் சேர்க்கவும்.','குடும்பத்தின் "அணி பெயரால்" தலைப்பிடுங்கள் — சேர்ந்து வாக்களிக்கவும்!'],connectionMoment:'தாத்தா/பாட்டி மற்றும் பேரன்/பேத்தி தலா ஒரு "அணியை" தேர்வு செய்யட்டும். ஸ்கோர் குடும்பத்தின் சாதனையை கொண்டாடுகிறது.',elderlyAdaptation:'காகிதம் கிழிப்பது அனைவரும் செய்யலாம். தாத்தா/பாட்டி கிழிக்கட்டும், குழந்தை வையுங்கள் மற்றும் ஒட்டட்டும்.'}
  },
  401:{
    zh:{steps:['将画布平放在桌上或地板上。','每人将手浸入自己选择的颜色中。','将手印印在画布上——重叠也很美。','在每个手印下方写上名字。','晾干，壁画成为一件家庭艺术品。'],connectionMoment:'按大小排列手印——从婴儿到祖父母。谈谈每双手曾经做过和创造过什么。',elderlyAdaptation:'协助老人用力按压手掌，印好后立即擦手。全程坐着完成。'},
    ms:{steps:['Bentangkan kanvas rata di atas meja atau lantai.','Setiap orang celupkan tangan ke dalam warna pilihan mereka.','Tekan cap tangan ke atas kanvas — bertindih adalah cantik.','Tulis nama di bawah setiap cap tangan.','Biarkan kering. Mural menjadi karya seni keluarga.'],connectionMoment:'Jajarkan cap tangan mengikut saiz — bayi hingga datuk/nenek. Bincangkan apa yang setiap pasang tangan telah lakukan dan cipta dalam hidup mereka.',elderlyAdaptation:'Bantu warga emas menekan tangan dengan kuat. Lap tangan segera selepas mencetak. Aktiviti duduk.'},
    ta:{steps:['கான்வாஸை மேசை அல்லது தரையில் தட்டையாக வையுங்கள்.','ஒவ்வொருவரும் தேர்ந்த வண்ணத்தில் கையை தோய்க்கட்டும்.','கான்வாஸில் கை அச்சு இடுங்கள் — ஒன்றின் மீது ஒன்று இடுவது அழகாக இருக்கும்.','ஒவ்வொரு கை அச்சின் கீழும் பெயர்கள் எழுதுங்கள்.','காயவிடுங்கள். சுவரோவியம் குடும்ப கலைப்படைப்பாகிறது.'],connectionMoment:'கை அச்சுகளை அளவின்படி வரிசைப்படுத்துங்கள் — குழந்தை முதல் தாத்தா/பாட்டி வரை. ஒவ்வொரு ஜோடி கைகளும் வாழ்வில் என்ன செய்தன என்று பேசுங்கள்.',elderlyAdaptation:'மூத்தோர் கையை இறுக்கமாக அழுத்த உதவுங்கள். அச்சிட்டவுடன் கையை உடனே துடையுங்கள். அமர்ந்தே செய்யும் செயல்பாடு.'}
  },
  402:{
    zh:{steps:['孩子在布料方块上画出代表"互帮互助"的图案。','祖父母用平针或回针绣出图案轮廓。','用布料颜料或更多绣线填充。','如有多个家庭，将所有方块拼成群体拼布。','每个家庭保留自己的方块作为纪念。'],connectionMoment:'祖父母教孩子一种针法——传承技艺。问：谁教您缝纫的？',elderlyAdaptation:'使用大孔绣花针和粗绣线，方便穿针。'},
    ms:{steps:['Kanak-kanak lukis reka bentuk di atas kain yang menggambarkan "tolong-menolong."','Datuk/nenek gariskan reka bentuk dengan jahitan lari atau jahitan balik.','Isi dengan cat kain atau jahitan lebih.','Jika ada keluarga berbilang: sambungkan semua petak menjadi kuilt kumpulan.','Setiap keluarga simpan petak mereka sebagai kenang-kenangan.'],connectionMoment:'Datuk/nenek ajar kanak-kanak satu jahitan — mewarisi kemahiran. Tanya: siapa yang ajar anda menjahit?',elderlyAdaptation:'Gunakan jarum mata besar dan benang sulaman tebal untuk memudahkan benang dimasukkan.'},
    ta:{steps:['குழந்தை துணி சதுரத்தில் "ஒருவருக்கொருவர் உதவுவது" என்பதை குறிக்கும் வடிவம் வரைக்கட்டும்.','தாத்தா/பாட்டி ஓடும் தையல் அல்லது பின்னோக்கி தையலில் வடிவத்தை வரையட்டும்.','துணி வண்ணம் அல்லது மேலும் தையல்களால் நிரப்புங்கள்.','பல குடும்பங்கள் இருந்தால்: அனைத்து சதுரங்களையும் ஒரு குழு கம்பளமாக இணைக்கவும்.','ஒவ்வொரு குடும்பமும் தங்கள் சதுரத்தை நினைவுப் பொருளாக வைத்துக்கொள்ளட்டும்.'],connectionMoment:'தாத்தா/பாட்டி குழந்தைக்கு ஒரு தையல் கற்பிக்கட்டும் — திறனை அடுத்த தலைமுறைக்கு கடத்தட்டும். கேளுங்கள்: உங்களுக்கு தையல் கற்பித்தது யார்?',elderlyAdaptation:'பெரிய கண்களுள்ள ஊசிகள் மற்றும் தடிமனான கேனா நூல் பயன்படுத்துங்கள்.'}
  },
  403:{
    zh:{steps:['一起用贴纸和和纸胶带装饰瓶子。','每人在纸条上写下或画出一段与家人的珍贵记忆。','将每张纸条卷起来放进瓶子里。','在艰难的日子里，取出一张纸条一起大声朗读。','用丝带封好瓶子。'],connectionMoment:'现在就大声朗读几张纸条。祖父母的记忆与孙辈的记忆并排。',elderlyAdaptation:'用画代替写，预先裁好纸条，使用大握柄笔或马克笔。'},
    ms:{steps:['Hiaskan balang bersama dengan pelekat dan pita washi.','Setiap orang tulis atau lukis satu kenangan berharga bersama keluarga di atas jalur kertas.','Gulung setiap jalur dan letakkan di dalam balang.','Pada hari yang susah, ambil satu jalur dan baca kuat-kuat bersama.','Meteraikan balang dengan reben.'],connectionMoment:'Baca beberapa jalur kuat-kuat sekarang. Kenangan datuk/nenek dan kenangan cucu bersebelahan.',elderlyAdaptation:'Lukis bukannya tulis. Jalur yang telah dipotong. Pen atau marker bergagang besar.'},
    ta:{steps:['பாட்டிலை சேர்ந்து ஸ்டிக்கர் மற்றும் வாஷி டேப்பால் அலங்கரிக்கவும்.','ஒவ்வொருவரும் குடும்பத்துடன் ஒரு விலைமதிப்பற்ற நினைவை காகித துண்டில் எழுதட்டும் அல்லது வரைக்கட்டும்.','ஒவ்வொரு துண்டையும் சுருட்டி பாட்டிலில் வையுங்கள்.','கஷ்டமான நாளில், ஒரு துண்டை எடுத்து சேர்ந்து சத்தமாக படியுங்கள்.','ரிப்பன் கொண்டு பாட்டிலை மூடுங்கள்.'],connectionMoment:'இப்போதே சில துண்டுகளை சத்தமாக படியுங்கள். தாத்தா/பாட்டியின் நினைவும் பேரன்/பேத்தியின் நினைவும் பக்கம் பக்கமாக.',elderlyAdaptation:'எழுதுவதற்கு பதிலாக வரையுங்கள். முன்கூட்டியே துண்டுகளை வெட்டுங்கள். பெரிய பிடியுள்ள பேனா அல்லது மார்க்கர் பயன்படுத்துங்கள்.'}
  },
  404:{
    zh:{steps:['在纸的全长上画一条横线。','标注年代：1950年、1960年、1970年……直到2026年。','祖父母分享重要人生事件——家人在时间线上补充。','孩子在每个事件旁边画插图。','如有家庭照片，可加上。'],connectionMoment:'祖父母出生时 vs 孙辈出生时——两者之间发生了哪些世界大事？',elderlyAdaptation:'祖父母坐着口述，孩子担任插画师和记录者。'},
    ms:{steps:['Lukis garisan mendatar merentasi keseluruhan panjang kertas.','Tandakan dekad: 1950, 1960, 1970... sehingga 2026.','Datuk/nenek kongsikan peristiwa penting dalam hidup — keluarga tambahkan pada garis masa.','Kanak-kanak lukis ilustrasi di tepi setiap peristiwa.','Tambah foto keluarga jika ada.'],connectionMoment:'Semasa datuk/nenek dilahirkan vs semasa cucu dilahirkan — peristiwa dunia apa yang berlaku di antara itu?',elderlyAdaptation:'Datuk/nenek bercerita sambil duduk. Kanak-kanak adalah pelukis dan jurtulis.'},
    ta:{steps:['காகிதத்தின் முழு நீளத்திலும் கிடைக்காக கோடு வரையுங்கள்.','தசாப்தங்களை குறியிடுங்கள்: 1950, 1960, 1970... 2026 வரை.','தாத்தா/பாட்டி முக்கிய வாழ்க்கை நிகழ்வுகளை பகிரட்டும் — குடும்பத்தினர் கால அட்டவணையில் சேர்க்கட்டும்.','குழந்தைகள் ஒவ்வொரு நிகழ்வின் அருகில் விளக்கப்படங்கள் வரைக்கட்டும்.','கிடைத்தால் குடும்பத்தின் புகைப்படங்கள் சேர்க்கவும்.'],connectionMoment:'தாத்தா/பாட்டி பிறந்த போது vs பேரன்/பேத்தி பிறந்த போது — இடையில் என்ன உலக நிகழ்வுகள் நடந்தன?',elderlyAdaptation:'தாத்தா/பாட்டி அமர்ந்தே கதை சொல்லட்டும். குழந்தைகள் விளக்கப்பட வலைஞர்கள் மற்றும் எழுத்தர்கள்.'}
  },
  405:{
    zh:{steps:['在背景中播放《Breathe Just Breathe》或其他舒缓音乐。','每人挑选让自己感到平静的颜色。','一起为曼陀罗涂色——每人填充一个区域。','填充一片花瓣时吸气数4拍，填充下一片时呼气数4拍。','完成后，描述您选择的颜色及原因。'],connectionMoment:'问：什么颜色对您来说代表平静？什么颜色代表家？没有错误答案。',elderlyAdaptation:'使用粗彩色铅笔，大号曼陀罗模板，全程坐着完成。'},
    ms:{steps:['Mainkan "Breathe Just Breathe" atau lagu tenang lain di latar belakang.','Setiap orang pilih warna yang terasa aman bagi mereka.','Warnakan mandala bersama — setiap orang isi bahagian masing-masing.','Tarik nafas selama 4 kiraan semasa mengisi satu kelopak, hembus 4 kiraan pada yang seterusnya.','Setelah selesai, huraikan warna yang anda pilih dan sebabnya.'],connectionMoment:'Tanya: warna apa yang terasa tenang bagi anda? Warna apa yang terasa seperti keluarga? Tiada jawapan yang salah.',elderlyAdaptation:'Gunakan pensel warna besar. Templat mandala besar. Duduk sepanjang masa.'},
    ta:{steps:['பின்னணியில் "Breathe Just Breathe" அல்லது மற்றொரு அமைதியான பாடல் ஒலிக்கட்டும்.','ஒவ்வொருவரும் தங்களுக்கு அமைதியாக உணரும் வண்ணங்களை தேர்ந்தெடுக்கட்டும்.','மண்டலத்தை சேர்ந்து வண்ணம் தீட்டுங்கள் — ஒவ்வொருவரும் ஒரு பகுதியை நிரப்பட்டும்.','ஒரு இதழை நிரப்பும்போது 4 எண்ணும்வரை மூச்சை உள்ளிழுக்கவும், அடுத்ததில் 4 எண்ணும்வரை வெளிவிடவும்.','முடிந்தவுடன், தேர்ந்தெடுத்த வண்ணங்களையும் காரணத்தையும் விவரிக்கவும்.'],connectionMoment:'கேளுங்கள்: எந்த வண்ணம் உங்களுக்கு அமைதியாக உணர்விக்கிறது? எந்த வண்ணம் குடும்பம் போல் உணர்விக்கிறது? தவறான பதில் இல்லை.',elderlyAdaptation:'தடிமனான வண்ண பென்சில்கள் பயன்படுத்துங்கள். பெரிய மண்டல டெம்ப்ளேட். முழு நேரமும் அமர்ந்திருக்கட்டும்.'}
  }

function applyEMCSS(on){
  const sizes=on?['14px','16px','19px','22px','25px','30px','36px']:['11px','13px','15px','17px','20px','24px','30px'];
  ['xs','sm','base','lg','xl','2xl','3xl'].forEach((s,i)=>document.documentElement.style.setProperty('--fs-'+s,sizes[i]));
}

function render(){
  applyEMCSS(S.user&&S.elderlyMode);
  const app=document.getElementById('app');
  if(S.screen==='login'){app.innerHTML=renderLogin();return;}
  if(S.showLangPicker){app.innerHTML=renderLangPicker();return;}
  app.innerHTML=renderTopbar()
    +'<div class="page"><div class="inner">'+renderScreen()+'</div></div>'
    +renderBottomNav()
    +'<div class="watermark">© The Music Scientist 2026 — SG Heartstrings — Confidential</div>';
}

function diffLabel(diff){
  const L=LANG[S.lang]||LANG.en;
  const map={easy:L.easy,medium:L.medium,hard:L.hard,Easy:L.easy,Medium:L.medium,Hard:L.hard};

function renderBottomNav(){
  const L=LANG[S.lang]||LANG.en;
  const base=[{id:'home',icon:'🏠',label:L.navHome},{id:'props',icon:'🥁',label:L.navProps},{id:'oldies',icon:'🎶',label:L.navOldies},{id:'songs',icon:'🎵',label:L.navSongs},{id:'crafts',icon:'🎨',label:L.navCrafts}];
  const extras=S.user.role==='facilitator'
    ?[{id:'sessions',icon:'📋',label:'Log'},{id:'impact',icon:'📊',label:'Impact'}]
    :S.user.role==='institution'
    ?[{id:'resources',icon:'📁',label:'Resources'}]
    :[{id:'about',icon:'ℹ️',label:L.navAbout}];
  const tabs=[...base,...extras];
  const cur=['props','oldies','songs','crafts','sessions','impact','resources','about'].includes(S.screen)?S.screen:'home';
  return '<nav class="bottomnav">'+tabs.map(t=>'<div class="nav-item'+(cur===t.id?' active':'')+'" onclick="go(\''+t.id+'\')">'
    +'<span class="nav-icon">'+t.icon+'</span>'
    +'<span class="nav-label">'+t.label+'</span>'
    +'</div>').join('')+'</nav>';
}

function renderScreen(){
  switch(S.screen){
    case 'home': return renderHome();
    case 'props': return S.propId?renderPropDetail():renderProps();
    case 'oldies': return renderOldies();
    case 'songs': return S.currentSong?renderSongDetail():renderSongs();
    case 'crafts': return S.currentCraft?renderCraftDetail():renderCrafts();
    case 'sessions': return S.subscreen==='new'?renderNewSession():renderSessions();
    case 'impact': return S.formDone?renderFormResult():renderImpactForm();
    case 'resources': return renderResources();
    case 'about': return renderAbout();
    default: return renderHome();
  }
}

    +'<div class="chips"><div class="chip'+(f===0?' active':'')+'" onclick="S.songFilter=0;render()">'+L.allSongs+'</div>'
    +THEMES.map(t=>'<div class="chip'+(f===t.id?' active':'')+'" onclick="S.songFilter='+t.id+';render()">'+t.emoji+' '+themeName(t)+'</div>').join('')+'</div>'
    +visible.map(s=>{
      const th=THEMES.find(t=>t.id===s.theme);
      return '<div class="item-card" onclick="openSong('+s.id+')">'
        +'<div class="item-emoji" style="background:'+th.bg+';">'+s.emoji+'</div>'
        +'<div class="item-info"><div class="item-title">'+s.title+'</div>'
        +'<div class="item-sub">'+s.sub+'</div>'
        +'<div class="item-meta"><span class="tag '+th.tagClass+'">'+th.emoji+' '+themeName(th)+'</span>'

        +s.langs.map(l=>'<span class="tag tag-lang">'+l+'</span>').join('')
        +'</div></div><span class="arrow">›</span></div>';

function renderSongDetail(){

function renderMovementSection(s){
  const L=LANG[S.lang]||LANG.en;
  const tabs=Object.keys(s.movements);
  const active=tabs.includes(S.moveTab)?S.moveTab:tabs[0];
  const mv=s.movements[active];
  // overlay translation if available
  const mt=((MOVE_TRANS[s.id]||{})[active]||{})[S.lang]||{};
  const desc=mt.desc||mv.desc;
  const cues=mt.cues||mv.cues;
  const icons={'Mobile Solo':'🚶','Mobile+Partner':'🚶‍♂️🚶‍♀️','Immobile Solo':'🪑','Immobile+Partner':'🤝'};
  return '<div class="detail-section"><h3>'+L.movementGuide+'</h3>'
    +'<div class="highlight-box purple" style="margin-bottom:12px;"><div class="highlight-text">'+L.movementDesc+'</div></div>'
    +'<div class="move-tabs">'
    +tabs.map(t=>'<div class="move-tab'+(active===t?' active':'')+'" onclick="S.moveTab=\''+t+'\';render()">'
      +'<span class="move-tab-icon">'+(icons[t]||'🎵')+'</span>'
      +'<div class="move-tab-label">'+t+'</div></div>').join('')+'</div>'
    +'<div class="card">'
    +'<div style="font-size:var(--fs-sm);font-weight:700;margin-bottom:8px;">'+active+'</div>'
    +'<div style="font-size:var(--fs-sm);color:var(--text);line-height:1.5;margin-bottom:12px;">'+desc+'</div>'
    +'<div style="font-size:var(--fs-sm);font-weight:700;margin-bottom:6px;">'+L.movementCues+'</div>'
    +cues.map(c=>'<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;"><span style="color:var(--red);font-weight:700;flex-shrink:0;">►</span><span style="font-size:var(--fs-sm);color:var(--text);line-height:1.4;">'+c+'</span></div>').join('')
    +'</div>'
    +(s.vimeoId?renderVimeoPlayer(s.vimeoId):videoPlaceholder('Movement Demo — '+s.title+' ('+active+')','Movement video in production — coming post-grant'))
    +'</div>';
}

    +'<div style="display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--text-muted);margin-top:4px;"><span>Not likely</span><span>Very likely</span></div>'

// ═══════════════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════════════
function pickRole(r){S._loginRole=r;render();}

function doLogin(){
  const code=(S._loginPin||'').trim().toLowerCase();
  if(!S._loginRole){S._loginErr='Please select your role.';render();return;}
  if(code!==ACCESS_CODES[S._loginRole]){S._loginErr='Incorrect access code. Contact The Music Scientist.';render();return;}
  S.user={role:S._loginRole};
  S.screen='home';S._loginErr=null;S._loginPin=null;S._loginRole=null;
  S.showLangPicker=true; // show language selection right after login
  render();
}

function selectLang(code){
  S.lang=code;
  S.showLangPicker=false;
  render();
}

function logout(){
  S.user=null;S.screen='login';S.elderlyMode=false;
  S.currentSong=null;S.currentCraft=null;S.propId=null;S.subscreen=null;
  S.showLangPicker=false;
  render();
}

function toggleEM(){S.elderlyMode=!S.elderlyMode;render();}

function go(screen){
  S.screen=screen;S.subscreen=null;S.currentSong=null;S.currentCraft=null;S.propId=null;
  render();window.scrollTo(0,0);
}

function openSong(id){S.currentSong=id;S.moveTab='Mobile Solo';render();window.scrollTo(0,0);}
function openCraft(id){S.currentCraft=id;render();window.scrollTo(0,0);}
function openProp(id){S.propId=id;render();window.scrollTo(0,0);}

function saveSession(){
  const ns=S.newSession;
  if(!ns.venue){alert('Please enter a venue.');return;}
  if(!ns.date){alert('Please enter a date.');return;}
  S.sessions.push({...ns,id:Date.now()});
  S.newSession={venue:'',date:'',elderly:0,children:0,theme:0};
  S.subscreen=null;render();
}

function submitImpact(){
  if(Object.keys(S.uclaAnswers).length<3)return;
  if(Object.keys(S.obsAnswers).length<4)return;
  if(S.npsScore===null)return;
  S.formDone=true;render();
}

function resetForm(){
  S.uclaAnswers={};S.obsAnswers={};S.npsScore=null;S.formDone=false;render();
}

// ─── BOOT ──────────────────────────────────────────────
render();
</script>
